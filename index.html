<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="score">
        <h1 class="ties">Ties: 0</h1>
    </div>
    <div class="winnerDiv">
        <h1 class="winner"></h1>
        <!-- In style display is none so it is not shown until 5 rounds have been completed. -->
        <button class="reset" onclick="resetGame()">Play Again?</button> 
    </div>
    <div class="playerSection">
        <h3 class="playerChoice"></h3>
        <h3 class="playerScore">Score: 0</h3>
        <div class="playerButtons">
            <button class="playerBtn" id="rock">Rock</button>
            <button class="playerBtn" id="paper">Paper</button>
            <button class="playerBtn" id="scissors">Scissors</button>
        </div>
    </div>
    <div class="computerSection">
        <h3 class="computerChoice"></h3>
        <h3 class="computerScore">Score: 0</h3>
    </div>
</body>
<script src="script.js"></script>
</html>
