<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="section-scoring">
        <p id="player-score-text">Player Score: 0</p>
        <p id="ties-text">Ties: 0</p>
        <p id="computer-score-text">Computer Score: 0</p>
    </div>

    <div class="section-announcement">
        <p id="announcement-text"></p>
    </div>

    <div class="section-choices">
        <p id="player-choice-text">Player Chose: </p>
        <p id="computer-choice-text">Computer Chose: </p>
    </div>

    <div class="section-buttons">
        <button class="buttons" id="rock">Rock</button>
        <button class="buttons" id="paper">Paper</button>
        <button class="buttons" id="scissors">Scissors</button>
    </div>

</body>
<script src="script.js"></script>
</html>
